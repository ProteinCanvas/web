[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proteincanvas"
version = "0.1.0"
description = "Visual analytics workbench for generative protein design"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["protein design", "structural biology", "visualization", "rfdiffusion", "proteinmpnn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "aiohttp>=3.9",
  "click>=8.1",
  "watchfiles>=0.21",
]

[project.urls]
Homepage = "https://github.com/ProteinCanvas/web"
Repository = "https://github.com/ProteinCanvas/web"
Issues = "https://github.com/ProteinCanvas/web/issues"

[project.scripts]
proteincanvas = "proteincanvas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["proteincanvas"]
include = ["proteincanvas/_static/**"]
