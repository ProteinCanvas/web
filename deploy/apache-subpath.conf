# Use this when the app must live at a sub-path, e.g. https://server.uni.edu/tools/proteincanvas/
# Build first with the matching BASE_PATH:
#   BASE_PATH=/tools/proteincanvas docker compose up --build

<VirtualHost *:443>
    ServerName server.your-university.edu

    SSLEngine on
    SSLCertificateFile    /path/to/cert.pem
    SSLCertificateKeyFile /path/to/key.pem

    ProxyPreserveHost On

    # Do NOT strip the prefix — ProteinCanvas expects to see the full path.
    ProxyPass        /tools/proteincanvas/ http://localhost:3000/tools/proteincanvas/
    ProxyPassReverse /tools/proteincanvas/ http://localhost:3000/tools/proteincanvas/

    Header always set Cross-Origin-Opener-Policy  "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Enable: a2enmod proxy proxy_http headers ssl
</VirtualHost>
